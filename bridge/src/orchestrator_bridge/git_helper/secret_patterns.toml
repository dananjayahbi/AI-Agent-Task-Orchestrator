# Documented default secret-like pattern set (MT-2.10-04; parent plan
# Sections 9.4 rule R5 "env/key patterns", 10.8, 9.10).
#
# Configuration, not folklore: this file is the whole default pattern list —
# adding or tuning a pattern is a data edit, never a code change. Each entry:
#
#   id          stable identifier reported in findings (and usable in the
#               scanner's ignore list)
#   severity    "high" | "medium" — surfaced in findings for prioritization
#   description one line a human or agent can act on
#   regex       Python regular expression, matched against one *added* line
#               of the merge-base diff (MT-2.10-03) at any position
#
# Keep the default set tight (MT-2.10-04 risk note): the families below are
# exactly those the plan names — private-key blocks, common API/token
# prefixes, secret assignments, AWS-style key shapes, bearer-token literals.
# Entropy-based or ML scanning is deliberately absent (not in the plan).
# Default ignore rules: none (a caller may pass ignore ids at scan time).

[[patterns]]
id = "private-key-block"
severity = "high"
description = "PEM-encoded private key block header"
regex = "-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----"

[[patterns]]
id = "aws-access-key-id"
severity = "high"
description = "AWS-style access key id shape"
regex = "\\bAKIA[0-9A-Z]{16}\\b"

[[patterns]]
id = "secret-assignment"
severity = "high"
description = "Secret-looking name assigned a non-trivial literal value"
regex = "(?i)\\b(?:api[_-]?key|api[_-]?secret|secret[_-]?key|access[_-]?key|auth[_-]?token|access[_-]?token|client[_-]?secret|private[_-]?key|password|passwd|secret|token)\\b\\s*[:=]=?\\s*[\"'][^\"'\\s]{8,}[\"']"

[[patterns]]
id = "bearer-token-literal"
severity = "medium"
description = "Bearer authorization header with a literal credential"
regex = "(?i)\\bbearer\\s+[A-Za-z0-9._+/=-]{16,}"

[[patterns]]
id = "github-token"
severity = "high"
description = "GitHub personal-access/app/installation token prefix"
regex = "\\b(?:gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,})\\b"
