# Tooling configuration for the MCP bridge + Merge Executor (parent plan Section 6.6;
# MT-0.1-02 tooling baseline; WP-2.1 adds the package build and MCP SDK dependency).
# The bridge is a standalone package — no repo-root workspace exists (MT-2.1-01 risk
# note), so this file alone drives its tooling. Src layout under src/orchestrator_bridge
# per Appendix A, buildable so `uv run` resolves imports and the MT-2.1-04 console
# scripts install as one-line launchers (Section 10.11).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator-bridge"
version = "0.0.1"
description = "MCP bridge and Merge Executor for the AI Agent Task Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    # Section 10.3 step 2 validates the manifest against the published schema
    # (MT-2.2-02) — already present transitively via mcp; declared directly
    # because the bridge imports it (schema-driven validation, one shared schema).
    "jsonschema>=4.23",
    "types-jsonschema",
]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

# --- Packaging: wheel carries only the bridge package (Appendix A src/ tree) ---

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_bridge"]

# Ship the *canonical* schemas/manifest.v1.json alongside the artifacts
# (MT-2.2-02: the published schema travels with the bridge). One source file in
# git — no second copy: the validator reads the repo file from a checkout and
# this build-time copy when installed standalone (identity enforced by the
# build). Static force-include cannot express both build contexts — a source
# checkout finds ../schemas/, while `uv build` builds the wheel from the
# extracted sdist where the file ships as schemas/ (this hook's sdist pass) —
# so resolution lives in hatch_build.py, which fails the build if neither
# candidate exists. hatch_build.py is force-included in the sdist by
# hatchling's defaults, so the hook also runs on rebuilds from that sdist.
[tool.hatch.build.hooks.custom]

# --- Console scripts: one-line launchers for the Section 10.2 run modes ------
# Generic entry honours --mode; the three mode scripts are the explicit
# invocation of the MT-2.1-04 precedence chain (explicit > config > stdio).
# `python -m orchestrator_bridge` is the module invocation of the same path.

[project.scripts]
orchestrator-bridge = "orchestrator_bridge.entrypoints:cli_entry"
orchestrator-bridge-stdio = "orchestrator_bridge.entrypoints.stdio:main"
orchestrator-bridge-http = "orchestrator_bridge.entrypoints.http:main"
orchestrator-bridge-executor = "orchestrator_bridge.entrypoints.executor:main"
# Section 10.11's `orchestrator init` surface (FR-MCP-08; WP-2.12) — the
# one-time onboarding command; `python -m orchestrator_bridge.init` is the
# same entry as a module invocation.
orchestrator = "orchestrator_bridge.init.cli:main"

# --- Ruff: formatter + linter (kept identical in backend/ and bridge/) ---

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # import sorting
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

# --- mypy: type checker (kept identical in backend/ and bridge/) ---

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["\\.venv"]
