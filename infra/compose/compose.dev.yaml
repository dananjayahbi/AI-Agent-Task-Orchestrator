# Dev overlay — hot-reload wiring for the `dev` profile (MT-0.2-02).
#
# Compose cannot vary a single service's config on the `--profile` flag alone,
# so the dev-only concerns live in this override file and are always paired
# with `--profile dev` (see README "Profiles"):
#
#   dev : docker compose -f compose.yaml -f compose.dev.yaml --profile dev ...
#   prod: docker compose -f compose.yaml           --profile prod ...
#
# The prod render (base file only) therefore contains no bind mounts and no
# debug flags (MT-0.2-02 risk note). WP-1.1 / WP-4.1 add their real reload
# commands (--reload / next dev) here — never to the base file.

services:
  backend:
    volumes:
      # Hot-reload source mount: repo backend/ appears at /app. Harmless for
      # the M0 stub (which runs from /opt/stub); the WP-1.1 image reads /app
      # (its venv lives at /opt/venv, outside this mount).
      - ../../backend:/app
    command:
      # MT-1.1-05: the real reload command promised by this file's header —
      # Uvicorn with hot reload over the bind mount (prod render keeps the
      # image CMD without --reload).
      - python
      - -m
      - uvicorn
      - config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-access-log
    environment:
      ORCHESTRATOR_DEBUG: "true" # debug on in dev; the base/prod render is "false"
      # The dev render selects the dev settings module for every backend-image
      # service (the image default is prod — Section 16.2 fail-fast would
      # otherwise refuse the placeholder secrets on migrate/worker/beat too).
      DJANGO_SETTINGS_MODULE: apps.core.settings.dev

  # One-shot migrate runs the same backend image: same dev settings override.
  migrate:
    environment:
      DJANGO_SETTINGS_MODULE: apps.core.settings.dev

  # WP-1.7 (MT-1.7-01): real celery commands now come from the base file
  # (`celery -A config.celery worker` / `beat`); the overlay only selects the
  # dev settings module. Note: worker/beat have no source bind mount (the dev
  # hot-reload mount belongs to `backend` alone), so code changes reach them
  # through an image rebuild — see README "Verifying worker and beat".
  worker:
    environment:
      DJANGO_SETTINGS_MODULE: apps.core.settings.dev

  beat:
    environment:
      DJANGO_SETTINGS_MODULE: apps.core.settings.dev

  web:
    volumes:
      # Hot-reload source mount: repo web/ appears at /app (WP-4.1 image).
      - ../../web:/app
    environment:
      NODE_ENV: development # debug/dev mode marker; prod render omits it
