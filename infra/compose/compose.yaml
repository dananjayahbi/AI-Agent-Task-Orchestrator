# Compose stack — AI Agent Task Orchestrator (WP-0.2, parent plan Section 16.1)
#
# Eight services from the Section 16.1 table with the exact dependency edges,
# one internal network and dev/prod profile split (MT-0.2-02), the documented
# environment template (MT-0.2-03), and the Section 16.1 health checks
# (MT-0.2-04). Configuration is environment-only (NFR-06): every value that
# differs per host is interpolated from the environment file — see
# infra/compose/.env.example. Bring-up/tear-down: README.md in this folder.
#
# Placeholder image remains for `web` (real image arrives with WP-4.1);
# `backend` is the real image from WP-1.1 / MT-1.1-05 — service names,
# published ports and health paths never change.

name: orchestrator

# ---------------------------------------------------------------------------
# Services (Section 16.1 table, in table order)
# ---------------------------------------------------------------------------
services:

  # --- postgres: official Postgres, no ports, data volume -----------------
  postgres:
    image: ${ORCHESTRATOR_IMAGE_POSTGRES:-postgres:16-alpine}
    environment:
      # Image-mandated names (configuration.md rule 7): mapped from the
      # canonical ORCHESTRATOR_DATABASE_* values in the template.
      POSTGRES_USER: ${ORCHESTRATOR_DATABASE_USER:-orchestrator}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD:-change-me}
      POSTGRES_DB: ${ORCHESTRATOR_DATABASE_NAME:-orchestrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck: # Section 16.1: Postgres readiness probe
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # No published ports (Section 16.1): reachable only on the internal network.

  # --- redis: official Redis, no ports, optional persistence ---------------
  redis:
    image: ${ORCHESTRATOR_IMAGE_REDIS:-redis:7.4-alpine}
    # Optional persistence (Section 16.1): the canonical true/false value is
    # mapped to Redis's mandated `--appendonly yes|no` flag here (rule 7).
    command: ["sh", "-c", "if [ \"${ORCHESTRATOR_CACHE_APPENDONLY:-true}\" = \"true\" ]; then exec redis-server --appendonly yes; else exec redis-server --appendonly no; fi"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck: # Section 16.1: ping
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- migrate: one-shot, backend image, gated by its exit code ------------
  migrate:
    image: ${ORCHESTRATOR_IMAGE_BACKEND:-orchestrator-backend:dev}
    build:
      context: ../../backend
    # One-shot migration runner from the real backend image (MT-1.1-05). The
    # exit code is this service's "health check" per Section 16.1; dependents
    # wait on it through `service_completed_successfully`.
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &backend-env
      # Derived from ORCHESTRATOR_DATABASE_* by default; set
      # ORCHESTRATOR_DATABASE_URL in .env only to point at an external
      # database. Canonical names reach the container too (NFR-06: one
      # vocabulary everywhere).
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql://${ORCHESTRATOR_DATABASE_USER:-orchestrator}:${ORCHESTRATOR_DATABASE_PASSWORD:-change-me}@postgres:5432/${ORCHESTRATOR_DATABASE_NAME:-orchestrator}} # pragma: allowlist secret
      ORCHESTRATOR_CACHE_URL: ${ORCHESTRATOR_CACHE_URL:-redis://redis:6379/0}
      ORCHESTRATOR_CACHE_BROKER_URL: ${ORCHESTRATOR_CACHE_BROKER_URL:-redis://redis:6379/0}
      ORCHESTRATOR_SECRET_KEY: ${ORCHESTRATOR_SECRET_KEY:-change-me}
      # Prod-posture default (the dev overlay flips backend to "true"; dev.py
      # itself defaults DEBUG on when the overlay selects it) — the base render
      # must never ship debug-on by accident (MT-1.1-05 risk note).
      ORCHESTRATOR_DEBUG: ${ORCHESTRATOR_DEBUG:-false}
      ORCHESTRATOR_LOG_LEVEL: ${ORCHESTRATOR_LOG_LEVEL:-INFO}
      # Loopback stays in the fallback: the container's own /health/ready
      # probe requests 127.0.0.1 and Django validates the Host header.
      # prod.py still refuses a loopback-ONLY list (real hostnames required).
      ORCHESTRATOR_ALLOWED_HOSTS: ${ORCHESTRATOR_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ORCHESTRATOR_STORAGE_MEDIA_ROOT: ${ORCHESTRATOR_STORAGE_MEDIA_ROOT:-/media}
      # Section 9.9 backup trigger (WP-6.2): the worker is the only service
      # that writes here, so only the worker gets the mount (below); the other
      # backend-family services inherit the name without the directory.
      ORCHESTRATOR_BACKUP_ROOT: ${ORCHESTRATOR_BACKUP_ROOT:-/backups}
      ORCHESTRATOR_BACKUP_TRIGGER_HOUR: ${ORCHESTRATOR_BACKUP_TRIGGER_HOUR:-2}
      ORCHESTRATOR_BACKUP_TRIGGER_MINUTE: ${ORCHESTRATOR_BACKUP_TRIGGER_MINUTE:-0}
      ORCHESTRATOR_BACKUP_RETENTION_DAYS: ${ORCHESTRATOR_BACKUP_RETENTION_DAYS:-14}
      ORCHESTRATOR_BACKUP_MIN_KEEP: ${ORCHESTRATOR_BACKUP_MIN_KEEP:-7}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    # Section 16.1 health check for a one-shot service is its exit code: the
    # `service_completed_successfully` condition on dependents is that check.

  # --- backend: ASGI server, LAN-published API port, media volume ----------
  backend:
    image: ${ORCHESTRATOR_IMAGE_BACKEND:-orchestrator-backend:dev}
    build:
      context: ../../backend
    environment: *backend-env
    # WP-6.3 MT-6.3-03 (miss M-1, serving-layer classification): uvicorn
    # process count. The image CMD runs ONE process, so sync Django views
    # serialize behind a single event loop/ASGI bridge at 20-way load
    # (captured in docs/plan/performance-report.md §5). Documented value:
    # default 1 = unchanged image behavior; the perf stack steps
    # ORCHESTRATOR_BACKEND_WORKERS through 4 then 8 (more serving
    # processes ≈ absorb the Section 18 scenario's 20 concurrent agents
    # without oversubscribing a shared local host) — the measured series
    # lives in performance-report.md §7 (MT-6.3-03).
    command:
      - python
      - -m
      - uvicorn
      - config.asgi:application
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --no-access-log
      - --workers
      - ${ORCHESTRATOR_BACKEND_WORKERS:-1}
    ports:
      # LAN-interface-only binding (Section 16.1); the bind address comes from
      # the environment so the same file works on Docker Desktop and a VPS
      # (NFR-06). Unset falls back to loopback — see .env.example (MT-0.2-03).
      - "${ORCHESTRATOR_BIND_ADDR:-127.0.0.1}:${ORCHESTRATOR_PORT_BACKEND:-8000}:8000"
    volumes:
      - backend_media:/media
    networks: [internal]
    healthcheck: # Section 16.1: GET /health/ready (real endpoint since MT-1.1-03; path stays)
      # python slim ships no wget/curl — probe with stdlib urllib instead.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              response = urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2)
              sys.exit(0 if response.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      # Exact Section 16.1 edges: postgres, redis, migrate.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- worker: backend image, Celery worker role, media volume -------------
  worker:
    image: ${ORCHESTRATOR_IMAGE_BACKEND:-orchestrator-backend:dev}
    build:
      context: ../../backend
    # WP-1.7 (MT-1.7-01): a real Celery worker consuming the Section 9.9 jobs
    # (broker from ORCHESTRATOR_CACHE_BROKER_URL; app in config/celery.py).
    command:
      - celery
      - -A
      - config.celery
      - worker
      - --loglevel=INFO
    environment: *backend-env
    volumes:
      - backend_media:/media
      # Section 16.5 second location for the daily dump + media sync (WP-6.2):
      # a host directory OUTSIDE every Docker volume, so losing postgres_data
      # or backend_media never loses the backup. The default is relative to
      # this compose file (infra/compose/backup-data/); point
      # ORCHESTRATOR_BACKUP_HOST_DIR at a second disk or network mount for
      # real off-host durability. Dumps contain the whole database (hashed
      # tokens, audit rows — Section 12.4): the directory stays out of Git.
      - ${ORCHESTRATOR_BACKUP_HOST_DIR:-./backup-data}:/backups
    networks: [internal]
    healthcheck: # Section 16.1: worker liveness via worker-ping (WP-1.7)
      # `inspect ping` is answered by the worker itself through the broker;
      # grep -q pong turns a silent/no-reply exit into an unhealthy state.
      test:
        [
          "CMD-SHELL",
          "celery -A config.celery inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- beat: backend image, Celery beat role, no volumes -------------------
  beat:
    image: ${ORCHESTRATOR_IMAGE_BACKEND:-orchestrator-backend:dev}
    build:
      context: ../../backend
    # WP-1.7 (MT-1.7-01): the beat scheduler for the two Section 9.9 60-second
    # jobs (lease-sweeper, lease-expiring-notifier; names fixed in
    # config/celery.py). Runs one beat instance (idempotent jobs tolerate
    # accidental doubles — see README).
    command:
      - celery
      - -A
      - config.celery
      - beat
      - --loglevel=INFO
    environment: *backend-env
    networks: [internal]
    healthcheck: # Section 16.1: process check — beat is pid 1 in this container
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  # --- web: real Next.js board image (web/Dockerfile — the WP-4.1 wiring
  # promised by .env.example), LAN-published web port, no volumes ----------
  web:
    image: ${ORCHESTRATOR_IMAGE_WEB:-orchestrator-web:dev}
    build:
      # Real board (WP-4.1); the M0 stub tree stays at ./stubs/web for
      # reference and for e2e/perf's prebuilt :stub image (perf's stack.py
      # never runs compose build).
      context: ../../web
    ports:
      # LAN-interface-only binding, environment-driven like `backend`.
      - "${ORCHESTRATOR_BIND_ADDR:-127.0.0.1}:${ORCHESTRATOR_PORT_WEB:-3000}:3000"
    networks: [internal]
    healthcheck: # Section 16.1: HTTP check
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

  # --- cloudflared: official image, no ports, outbound-only tunnel ----------
  # WP-5.1 (MT-5.1-01): the M0 tokenless quick-tunnel placeholder is replaced
  # by the named tunnel started from the environment-provided token
  # (Section 15.4 — the tunnel token is a secret in the environment; real value
  # lives only in the git-ignored .env, never in Git). Pinned official image
  # (prod rule; ORCHESTRATOR_IMAGE_CLOUDFLARED in .env.example documents the
  # upgrade path). Zero published ports, internal network only (FR-NET-01,
  # GOAL-4). Fail-fast (Section 16.2): with a missing or invalid token
  # cloudflared exits non-zero at startup, so a prod `up --wait` can never go
  # green without ORCHESTRATOR_CLOUDFLARE_TUNNEL_TOKEN.
  #
  # Profiles: [prod, tunnel] — deliberate (MT-5.1-01 scope):
  #   * `--profile prod`  -> included; the Section 16.1 eight render as before,
  #     and the token fail-fast above applies.
  #   * `--profile dev`   -> NOT started: the documented dev behavior is to run
  #     the stack without the tunnel (Section 16.2 fail-fast posture).
  #   * `--profile dev --profile tunnel` -> tunnel opted into dev explicitly.
  cloudflared:
    image: ${ORCHESTRATOR_IMAGE_CLOUDFLARED:-cloudflare/cloudflared:2026.10.0}
    profiles: [prod, tunnel]
    # Global flags before the `tunnel` subcommand (MT-0.2-04 lesson); the
    # config file is the canonical ingress ruleset (MT-5.1-02) mounted below —
    # under a token run cloudflared takes its routes from the edge and uses
    # this file as the validated/mirrored source of truth (infra/cloudflare/README.md).
    # Fixed metrics port so the `tunnel ready` health probe can find it.
    command: ["--metrics", "0.0.0.0:20240", "--no-autoupdate", "--config", "/etc/cloudflared/config.yaml", "tunnel", "run"]
    environment:
      # configuration.md rule 7: canonical name stays in the template; the
      # container receives cloudflared's image-mandated TUNNEL_TOKEN.
      # Empty default = template placeholder (fail-fast per the note above).
      TUNNEL_TOKEN: ${ORCHESTRATOR_CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      # Canonical ingress rules (MT-5.1-02): internal service names only, no
      # published ports referenced; read-only.
      - ../cloudflare/ingress.yaml:/etc/cloudflared/config.yaml:ro
    networks: [internal]
    healthcheck: # Section 16.1: tunnel status (cloudflared's own readiness probe; distroless = exec form only)
      test: ["CMD", "cloudflared", "--metrics", "0.0.0.0:20240", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy

  # --- mailhog-style helper tooling (Section 16.1: "dev" profile) ----------
  # dev-profile only: SMTP catcher for outbound mail during development.
  # Publishes no host port (MT-0.2-02 acceptance: only backend and web do);
  # the backend reaches it at smtp://mailhog:1025 on the internal network.
  mailhog:
    image: ${ORCHESTRATOR_IMAGE_MAILHOG:-mailhog/mailhog:v1.0.1}
    profiles: [dev]
    networks: [internal]
    healthcheck: # helper service — SMTP listener check so `--wait` covers it too
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------------------------------------------------------------------
# Networking (Section 16.1): exactly one internal network for all services.
# Deliberately a plain bridge (not Docker's `internal: true` flag): `cloudflared`
# needs outbound internet for the tunnel, while isolation is achieved by
# publishing host ports only for `backend` and `web`.
# ---------------------------------------------------------------------------
networks:
  internal:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes (Section 16.1 / 16.3: local named volumes by default)
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  backend_media:
