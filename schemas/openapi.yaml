              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/tokens:
    get:
      operationId: api_v1_tokens_retrieve
      description: 'List the caller''s API tokens as metadata (no hash, no plaintext).
        Sort: id descending (newest first). Pagination: cursor-based — pass `cursor`
        from the previous `next_cursor`; `page_size` defaults to 25 and is clamped
        to 100.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from the previous page's next_cursor.
      - in: query
        name: kind
        schema:
          enum:
          - owner_session
          - agent
          - device
          type: string
          minLength: 1
        description: |-
          Filter by token kind.

          * `owner_session` - owner session
          * `agent` - agent
          * `device` - device
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
        description: Items per page (default 25, maximum 100; values above the maximum
          are clamped — pagination.md documented defaults).
      - in: query
        name: project_id
        schema:
          type: string
          pattern: ^PID[0-9]{5}$
          minLength: 1
        description: Filter by project id (agent tokens are project-scoped).
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/tokens/{id}:
    delete:
      operationId: api_v1_tokens_destroy
