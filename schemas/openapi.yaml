        replays a retried submission with no second row and no second transition (NFR-12).
        Rejections: LEASE_NOT_OWNED (403), LEASE_EXPIRED/TASK_STATE_CONFLICT/SCOPE_VIOLATION
        (409), TASK_NOT_FOUND (404), AUTH_FORBIDDEN_PROJECT (403).'
