openapi: 3.0.3
info:
  title: AI Agent Task Orchestrator
  version: 1.0.0
  description: 'REST API contract for the AI Agent Task Orchestrator. NFR-11: this
    document is the single source of truth for web and mobile clients. Errors use
    the Section 9.2 envelope; list endpoints are cursor-paginated (docs/plan/conventions/pagination.md).'
paths:
  /api/v1/agent-sessions:
    post:
      operationId: open_agent_session
      description: 'Open an agent session (Section 9.2 Sessions row; caller: Bridge).
        The session id is bridge-issued and unguessable (G-18) and travels in the
        body; `project_id` and `token_id` are taken from the authenticated agent token
        — never from the payload (ADR-004; a body `project_id` is rejected as an unknown
        field). `capability` defaults to `unknown` (Section 10.4); `transport` is
        one of Section 10.2''s run modes. 201 returns the Section 7.2 row; a duplicate
        id answers VALIDATION_ERROR; `Idempotency-Key` replays a retried open without
        creating a second row.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-derived key making retries safe (ADR-012; NFR-12). Reusing
          the key with the same request replays the original outcome instead of opening
          a second session.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSessionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSessionCreate'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/agent-sessions/{id}/end:
    post:
      operationId: end_agent_session
      description: 'End an agent session (Section 9.2 Sessions row; caller: Bridge).
        Sets `ended_at` exactly once; repeating the call returns the same row unchanged
        (best-effort shutdown calls must be safe). The session''s project must match
        the token''s scope (AUTH_FORBIDDEN_PROJECT otherwise); an unknown id answers
        the standard no-catalog-code mapping (VALIDATION_ERROR, 400). `Idempotency-Key`
        replays a retried end.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-derived key making retries safe (ADR-012; NFR-12). Reusing
          the key with the same request replays the original outcome instead of opening
          a second session.
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/attachments/{id}:
    get:
      operationId: retrieve_attachment
      description: 'Read one attachment descriptor by id (Section 9.2; caller: Owner
        or an agent token scoped to the attachment''s project). `token_count` and
        `short_description` are null until the WP-1.12 pipeline fills them (FR-ATT-03/07).
        Foreign agent tokens answer AUTH_FORBIDDEN_PROJECT (403); unknown or malformed
        ids answer VALIDATION_ERROR (400 — the catalog has no attachment not-found
        code; recorded mapping).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    delete:
      operationId: delete_attachment
      description: 'Delete one attachment (Section 9.2; caller: Owner only). Resolved
        conservatively against Section 16.3: on a completed or archived task the call
        answers 409 TASK_STATE_CONFLICT — the retention job owns those bytes (archive
        plus the configurable grace period, Section 12.4; OQ-10 default 30 days).
        On any earlier state the record is soft-deleted (`deleted_at` stamped) and
        the stored object is removed only when no other de-duplicated record shares
        its content key. `Idempotency-Key` replays a retried DELETE''s response (ADR-012).'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-derived key making retries safe (ADR-012; NFR-12). Reusing
          the key with the same upload replays the original response instead of storing
          a second copy; reusing it with a different upload is an open point (headers.md)
          and executes normally.
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDelete'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/attachments/{id}/content:
    get:
      operationId: retrieve_attachment_content
      description: 'Retrieve one attachment''s content (Section 9.2; caller: Owner
        or an agent token scoped to the attachment''s project). The `format` parameter
        follows the Section 9.5 retrieval table: `auto` (default) is text-safe — documents
        resolve to paginated `markdown`, images to `text_ocr` (OCR transcript plus
        layout description); `image_base64` serves the normalized image and answers
        ATTACHMENT_UNSUPPORTED_FORMAT (415) for non-images; `markdown` and `text_ocr`
        answer 415 where the attachment has no such representation. `page` is one-based
        (the pagination.md content exception): paginated responses carry `page_number`,
        `total_pages` and the page''s token count so an agent can budget context;
        non-paginated responses omit them. Every delivered text value is prefixed
        with the untrusted-content banner (P10). Attachments not `ready` answer 409
        ATTACHMENT_NOT_READY (`failed` includes the stored reason). Unknown `format`/`page`
        values and unknown query parameters answer VALIDATION_ERROR (400).'
      parameters:
      - in: query
        name: format
        schema:
          enum:
          - auto
          - image_base64
          - text_ocr
          - markdown
          type: string
          default: auto
          minLength: 1
        description: |-
          Section 9.5 retrieval table: auto (default; text-safe — documents resolve to markdown, images to text_ocr), image_base64, text_ocr, markdown. Unknown values answer VALIDATION_ERROR.

          * `auto` - auto
          * `image_base64` - image_base64
          * `text_ocr` - text_ocr
          * `markdown` - markdown
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: One-based page for paginated formats (markdown; auto on documents
          — Section 9.5 pagination clause, the pagination.md content exception). Defaults
          to 1; out-of-range and non-integer values answer VALIDATION_ERROR. Ignored
          by the non-paginated formats.
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentContent'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: api_v1_auth_login_create
      description: Verify credentials, start the session, return the binding once.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: api_v1_auth_logout_create
      description: Revoke the caller's ``owner_session`` row and flush its session.
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoked'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: api_v1_auth_refresh_create
      description: Push expiry forward by the Section 9.10 lifetime; return it.
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refreshed'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/dashboard/summary:
    get:
      operationId: retrieve_dashboard_summary
      description: 'Per-project Overview cards for the Home / Overview surfaces (Section
        14.1; FR-MOB-01). Every registered project appears once, ordered by project
        id. `state_counts` carries all six canonical G-01 states (ADR-010), zero-filled,
        over the project''s non-archived tasks (T19 default visibility). `velocity`
        counts the project''s completions in the trailing 7-day window on the server
        clock (conservative documented default — the plan states no definition; this
        payload is authoritative and clients never recompute it). `active_agents`
        counts AgentSession rows with `ended_at` null. Single-resource GET — no pagination
        (pagination.md). Caller: Owner only (Section 9.2); agents and devices answer
        ROLE_NOT_PERMITTED, anonymous callers AUTH_REQUIRED.'
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/devices:
    get:
      operationId: api_v1_devices_retrieve
      description: 'List the caller''s registered devices as metadata (no push_token,
        no token material) — the Section 13.1 account settings surface. Sort: id descending
        (newest first). Pagination: cursor-based — pass `cursor` from the previous
        `next_cursor`; `page_size` defaults to 25 and is clamped to 100. Revoked devices
        stay listed with `revoked_at` set so settings can show history.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from the previous page's next_cursor.
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
        description: Items per page (default 25, maximum 100; values above the maximum
          are clamped — pagination.md documented defaults).
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    post:
      operationId: api_v1_devices_create
      description: Register a device after Owner login (Section 9.2 Devices row; Section
        12.2). Creates the Device row and its `kind = device` API Token atomically;
        the plaintext `token` is returned exactly once — store it in platform secure
        storage (Section 12.2). `Idempotency-Key` replays a retried registration instead
        of duplicating the device (ADR-012).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-derived key making retries safe (ADR-012; NFR-12). Reusing
          the key with the same request replays the original 201 outcome — the same
          device id and token material — instead of registering a second device; reuse
          with a different request is an open point (headers.md) and executes normally.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/devices/{id}:
    delete:
      operationId: api_v1_devices_destroy
      description: Revoke one of the caller's devices (immediate on both rows).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoked'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/events:
    get:
      operationId: api_v1_events_retrieve
      description: 'Event history (Section 9.6 envelope per item). Sort: id ascending
        (chronological — the monotonic SSE id order). Pagination: cursor-based — pass
        `cursor` from the previous `next_cursor`; `page_size` defaults to 25 and is
        clamped to 100. Filters: `project`, `task` (Section 9.6 names).'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from the previous page's next_cursor.
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
        description: Items per page (default 25, maximum 100; values above the maximum
          are clamped — pagination.md documented defaults).
      - in: query
        name: project
        schema:
          type: string
          pattern: ^PID[0-9]{5}$
          minLength: 1
        description: Only events for this project id (PID + five digits, Section 7.3).
      - in: query
        name: task
        schema:
          type: string
          pattern: ^PID[0-9]{5}-T[0-9]{3,}$
          minLength: 1
        description: Only events for this task id ({PID}-T{index}, Section 7.3).
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/events/stream:
    get:
      operationId: api_v1_events_stream_retrieve
      description: 'Server-Sent Events feed of Section 9.6 envelopes (`id:` carries
        the monotonic event id; `data:` carries the envelope JSON; comment lines are
        heartbeats and carry no id). Filters: `project`, `task`, fixed at connect.
        Resume: send the last received id as the `Last-Event-ID` header (or `last_event_id`
        query parameter) to replay missed events before switching to live. Authentication:
        owner session or device bearer token — agents never subscribe (Section 12.2).'
      parameters:
      - in: query
        name: project
        schema:
          type: string
          pattern: ^PID[0-9]{5}$
          minLength: 1
        description: Only events for this project id (PID + five digits, Section 7.3).
      - in: query
        name: task
        schema:
          type: string
          pattern: ^PID[0-9]{5}-T[0-9]{3,}$
          minLength: 1
        description: Only events for this task id ({PID}-T{index}, Section 7.3).
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/projects:
    get:
      operationId: list_projects
      description: 'List registered projects. Sort: project id ascending — PID generation
        order, i.e. creation order (zero-padded Section 7.3 ids make lexicographic
        order deterministic; pagination.md rule 2). Pagination: cursor-based — pass
        `cursor` from the previous `next_cursor`; `page_size` defaults to 25, clamped
        to 100. Caller: Owner only — the list spans every project, so agent tokens
        are refused here (ROLE_NOT_PERMITTED); an agent reads its own project through
        `GET /projects/{pid}` instead.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from the previous page's next_cursor.
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
        description: Items per page (default 25, maximum 100; values above the maximum
          are clamped — pagination.md documented defaults, same per-endpoint choice
          as GET /tokens).
      tags:
      - api
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    post:
      operationId: create_project
      description: 'Create a project. The `PID` id is assigned server-side from the
        Section 7.3 database sequence — no client-supplied id is accepted (an `id`
        key is rejected as unknown). The default Project Policy (Section 7.2 defaults)
        is created as a pair (Section 7.1). Optional `policy_preset` (WP-3.1) seeds
        the new policy''s three glob fields from a framework preset (django | nextjs
        | flutter); omitted = stock Section 7.2 defaults. Caller: Owner only.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/projects/{pid}:
    get:
      operationId: retrieve_project
      description: 'Read one project. Caller: Owner or an agent token scoped to this
        project (Section 9.2: agents read-only for own project); other agent tokens
        answer AUTH_FORBIDDEN_PROJECT (403) and devices ROLE_NOT_PERMITTED. A malformed
        or unknown pid answers VALIDATION_ERROR (400): the catalog has no PROJECT_NOT_FOUND.'
      parameters:
      - in: path
