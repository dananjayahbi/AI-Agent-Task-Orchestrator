  /api/v1/projects/{pid}/tasks:
    get:
      operationId: list_tasks
      description: 'List one project''s tasks (Section 9.2; caller: Owner only). Default
        order is FR-TSK-05 canonical: `urgent > high > medium > low`, then oldest
        `created_at` first (FIFO), then the task id''s generation order (`T001` …
        `T999` < `T1000`) — one deterministic sort computed in the database (NFR-09).
        Filters: repeat `state` for canonical values, single `priority`; archived
        tasks are excluded unless `include_archived=true` (T19 default visibility).
        Pagination: cursor-based — pass `cursor` from the previous `next_cursor` *with
        the same filters* (pagination.md rule 1); `page_size` defaults to 25, clamped
        to 100. Results never cross the path project.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from the previous page's next_cursor; valid only
          with the same filters it was issued under (pagination.md rule 1).
      - in: query
        name: include_archived
        schema:
          type: boolean
          default: false
        description: Include soft-archived tasks; default false — archived tasks are
          hidden from boards by default (Section 8.2 T19).
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
        description: Items per page (default 25, maximum 100; values above the maximum
          are clamped — pagination.md documented defaults, same per-endpoint choice
          as GET /projects).
      - in: path
        name: pid
        schema:
          type: string
        required: true
      - in: query
        name: priority
        schema:
          enum:
          - urgent
          - high
          - medium
          - low
          type: string
          minLength: 1
        description: |-
          FR-TSK-05 priority filter (single value).

          * `urgent` - urgent
          * `high` - high
          * `medium` - medium
          * `low` - low
      - in: query
        name: state
        schema:
          type: array
          items:
            enum:
            - draft
            - pending
            - in_progress
            - to_be_audited
            - in_human_review
            - completed
            type: string
            description: |-
              * `draft` - draft
              * `pending` - pending
              * `in_progress` - in_progress
              * `to_be_audited` - to_be_audited
              * `in_human_review` - in_human_review
              * `completed` - completed
        description: Canonical states to include; repeat for several (?state=draft&state=pending).
          Unknown values are VALIDATION_ERROR.
      tags:
      - api
