          type: boolean
          description: If false, every task goes to human review; default true (7.2).
        merge_strategy:
          allOf:
          - $ref: '#/components/schemas/MergeStrategyEnum'
          description: |-
            squash (default) / merge_commit / fast_forward_only (7.2).

            * `squash` - squash
            * `merge_commit` - merge commit
            * `fast_forward_only` - fast forward only
        branch_prefix:
          type: string
          description: Canonical branch-name prefix, `{PID}` resolved per project
            when names are derived (G-09; default `feat/{PID}-`). Changing it affects
            bridge branch naming from WP-2.x on.
        audit_required_default:
          type: boolean
          description: Default audit_required for new tasks; default true (7.2).
        stalled_after_minutes:
          type: integer
          minimum: 1
          description: UI warning when no checkpoint arrives; default 20 (7.2).
        policy_preset:
          allOf:
          - $ref: '#/components/schemas/PolicyPresetEnum'
