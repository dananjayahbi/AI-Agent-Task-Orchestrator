    PatchedProjectPolicy:
      type: object
      description: The Section 7.2 policy table as a validated read/write contract.
      properties:
        lease_duration_minutes:
          type: integer
          minimum: 1
          description: Lease length and per-checkpoint extension; default 45 (7.2).
        lease_max_total_minutes:
          type: integer
          minimum: 1
          description: Hard cap on one continuous claim; default 240 (7.2). Must be
            >= lease_duration_minutes (MT-3.1-03 cross-field rule).
        lease_extension_mode:
          allOf:
          - $ref: '#/components/schemas/LeaseExtensionModeEnum'
          description: |-
            checkpoint_only (default) or checkpoint_and_liveness (per-project option — OQ-04's recommended product default is unchanged; checkpoint_only is the enforced default, MT-3.1-01).

            * `checkpoint_only` - checkpoint only
            * `checkpoint_and_liveness` - checkpoint and liveness
        max_retries:
          type: integer
          minimum: 1
          description: Lease failures before escalation; default 3 (7.2).
        max_concurrent_tasks:
          type: integer
          minimum: 0
          description: 'Simultaneous in_progress tasks; default 1 (G-26). 0 is legal:
            it pauses claiming without touching active_status.'
        autonomous_diff_threshold_lines:
          type: integer
          minimum: 1
          description: Max changed lines for auto-complete; default 250 (7.2).
        auditor_min_confidence:
          type: integer
          maximum: 5
          minimum: 1
          description: Minimum auditor confidence, 1-5; default 4 (7.2).
        critical_path_globs:
          type: array
          items:
            type: string
          description: 'Escalating paths (CI/CD, root migrations, security config).
            Section 12.3 rules apply (MT-3.1-03): syntax-checked, repo-root-relative,
            no ''..'' traversal.'
        migration_path_globs:
          type: array
          items:
            type: string
          description: Escalating framework-specific migration paths; Section 12.3
            rules apply (MT-3.1-03).
        sensitive_config_globs:
          type: array
          items:
            type: string
          description: Escalating env/key/security-rule paths; Section 12.3 rules
            apply (MT-3.1-03).
        auto_complete_enabled:
          type: boolean
          description: If false, every task goes to human review; default true (7.2).
        merge_strategy:
          allOf:
          - $ref: '#/components/schemas/MergeStrategyEnum'
          description: |-
            squash (default) / merge_commit / fast_forward_only (7.2).

            * `squash` - squash
            * `merge_commit` - merge commit
            * `fast_forward_only` - fast forward only
        branch_prefix:
          type: string
          description: Canonical branch-name prefix, `{PID}` resolved per project
            when names are derived (G-09; default `feat/{PID}-`). Changing it affects
            bridge branch naming from WP-2.x on.
        audit_required_default:
          type: boolean
          description: Default audit_required for new tasks; default true (7.2).
        stalled_after_minutes:
          type: integer
          minimum: 1
          description: UI warning when no checkpoint arrives; default 20 (7.2).
        policy_preset:
          allOf:
          - $ref: '#/components/schemas/PolicyPresetEnum'
          writeOnly: true
          description: |-
            Apply a framework preset (WP-3.1): fills critical_path_globs, migration_path_globs and sensitive_config_globs in one action. Unknown ids are rejected; combining it with any explicit glob field in the same request is refused (no implicit ordering). Omitting it leaves the patched globs as sent.

            * `django` - django
            * `nextjs` - nextjs
            * `flutter` - flutter
