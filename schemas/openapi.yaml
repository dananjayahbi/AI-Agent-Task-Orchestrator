      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Resolution'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    ResolutionPatch:
      type: object
      description: '``GET /resolutions/{id}/patch`` body — one shape, both paths (9.2).'
      properties:
        resolution_id:
          type: string
          format: uuid
        kind:
          type: string
          description: 'Artifact kind (Section 7.2): patch.'
        sha256:
          type: string
          description: Server-computed SHA-256 of the patch bytes (Section 7.2; 9.7).
        size_bytes:
          type: integer
          description: Server-computed size in bytes (Section 7.2) — compared against
            the Section 9.7 5 MB cap (inclusive) for diff_too_large.
        diff_too_large:
          type: boolean
          description: True when the patch exceeded the 5 MB cap and only stats/file
            list were kept (Section 9.7's degraded path).
        patch:
          type: string
          nullable: true
          description: The stored unified patch, or null on the oversize path (9.7).
        marker:
          type: string
          nullable: true
          description: 'Literal viewers render on the oversize path: ''diff too large''
            (Section 9.7; null when the body is served).'
      required:
      - diff_too_large
      - kind
      - marker
      - patch
      - resolution_id
      - sha256
      - size_bytes
    ResolutionSubmit:
      type: object
      description: '``POST /tasks/{id}/resolution`` input (Section 10.5 tool contract).'
      properties:
        session_id:
          type: string
          description: Lease-holding session id (G-18) — the fencing pair's identity
            half; becomes submitted_by_session (Section 7.2).
          maxLength: 255
        lease_generation:
          type: integer
          minimum: 0
          description: Fencing generation from the claim response (Section 8.6; ADR-012);
            a stale value answers LEASE_EXPIRED.
        git_branch:
          type: string
          description: Verified branch the patch was captured from (Section 10.5;
            stored as the Section 7.2 branch_name).
          maxLength: 255
        commit_sha:
          type: string
          description: Commit the submission points at (Section 10.5; the bridge verified
            it matches the branch — stored verbatim).
          maxLength: 64
        execution_summary:
          type: string
          description: The coder's summary of what ran (Section 10.5).
        requires_human_attention:
          type: boolean
          default: false
          description: The coder's self-flag (Section 10.5) — true routes the submission
            to T8 with review_reason self_flagged (8.2/8.4).
        risk_justification:
          type: string
          default: ''
          description: The coder's justification when self-flagging (Section 7.2).
        patch:
          type: string
          description: 'The captured unified patch, branch vs. default-branch merge-base
            (Section 9.7) — parsed server-side for the authoritative changed_files
            and diff_summary; subject to the 5 MB cap with a degraded stats-only path,
            never a rejection. Whitespace (the trailing newline) is content: the sha256
            the bridge computes locally must match the bytes stored here.'
        changed_files:
          type: array
          items:
            type: string
          nullable: true
          description: 'Bridge-captured file list (Section 10.5) — provisional: the
            server''s patch parse replaces it outright (Section 9.7).'
        diff_summary:
          type: object
          additionalProperties: {}
          nullable: true
          description: 'Bridge-captured stats (Section 10.5) — provisional: the server''s
            patch parse replaces it outright (Section 9.7).'
      required:
      - commit_sha
      - execution_summary
      - git_branch
      - lease_generation
      - patch
      - session_id
    ResolutionTaskState:
      type: object
      description: The post-transition task identity the bridge reports (Section 10.5).
      properties:
        id:
          type: string
        state:
          type: string
          description: Canonical state after the dispatch — to_be_audited (T7), in_human_review
            (T8/T10 escalate) or to_be_audited with merge_status pending (T10 approve,
            Section 8.5).
        version:
          type: integer
          description: Optimistic-lock version after the row (7.2).
        review_reason:
          type: string
          nullable: true
          description: Section 8.4 member set by T8/T10-escalate; null on the clean
            T7 path.
        merge_status:
          type: string
          description: none | pending | merging | merged | conflict | failed (7.2)
            — pending marks T10's merge-pending branch.
      required:
      - id
      - merge_status
      - review_reason
      - state
      - version
    ResolutionWriteResponse:
      type: object
      description: The frozen submission response — Section 10.5 outcome reporting.
      properties:
        resolution:
          allOf:
          - $ref: '#/components/schemas/Resolution'
          description: The stored Section 7.2 row.
        task:
          allOf:
          - $ref: '#/components/schemas/ResolutionTaskState'
          description: Post-transition task identity — the outcome the agent is told.
        trigger:
          type: string
          description: 'Which Section 8.2 row fired: submit (T7), submit_flagged (T8),
            submit_unreviewed / submit_policy_approved (T10''s two branches).'
        scope_violations:
          type: array
          items:
            type: string
          description: Changed files outside target_scope (Section 12.3; empty when
            clean) — the offending paths captured for review_reason scope_violation.
      required:
      - resolution
      - scope_violations
      - task
      - trigger
    Revoked:
      type: object
      description: 'POST /auth/logout: the instant the session token stopped working.'
      properties:
        revoked_at:
          type: string
          format: date-time
      required:
      - revoked_at
    RoleEnum:
      enum:
      - coder
      - auditor
      type: string
      description: |-
        * `coder` - coder
        * `auditor` - auditor
    RulesBlock:
      type: object
      description: 'Section 10.6 rules block: standard rules + project rules appended.'
      properties:
        standard_rules:
          type: array
          items:
            type: string
        project_rules:
          type: string
      required:
      - project_rules
      - standard_rules
    StateCounts:
      type: object
      description: |-
        The six canonical G-01/ADR-010 state counts, always all present.

        Zero-filled by the service: a state with no tasks reads ``0``, never
        an absent key — the mobile card renders every column from these keys
        and never invents its own (G-01; MT-5.6-01).
      properties:
        draft:
          type: integer
          minimum: 0
          description: Tasks in draft (Section 8.2 T1).
        pending:
          type: integer
          minimum: 0
          description: Tasks visible to agents for claiming (Section 8.2).
        in_progress:
          type: integer
          minimum: 0
          description: Tasks under an active coder lease (Section 8.6).
        to_be_audited:
          type: integer
          minimum: 0
          description: Submissions awaiting an auditor claim (Section 8.2).
        in_human_review:
          type: integer
          minimum: 0
          description: Tasks escalated to the Owner — the mobile 'needs review' banner
            derives from this count (Section 14.1; FR-MOB-04).
        completed:
          type: integer
          minimum: 0
          description: Completed tasks; immutable except archive (Section 7.4 rule
            3).
      required:
      - completed
      - draft
      - in_human_review
      - in_progress
      - pending
      - to_be_audited
    StateEnum:
      enum:
      - draft
      - pending
      - in_progress
      - to_be_audited
      - in_human_review
      - completed
      type: string
      description: |-
        * `draft` - draft
        * `pending` - pending
        * `in_progress` - in_progress
        * `to_be_audited` - to_be_audited
        * `in_human_review` - in_human_review
        * `completed` - completed
    Task:
      type: object
      description: |-
        GET representation of a task — Section 7.2 fields, in plan order.

        One documented addition beyond the 7.2 table: ``attachments`` — the
        FR-ATT-03 descriptor list (MT-1.14-01; descriptors only, content
        stays lazy behind the Section 9.2 content endpoint).
      properties:
        id:
          type: string
          readOnly: true
          description: '{PID}-T{index} (Section 7.3); server-assigned, immutable.'
        project_id:
          type: string
          readOnly: true
          description: Section 7.2 project_id FK — never changes (7.4 rule 4).
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
          description: Markdown description (FR-TSK-02).
        acceptance_criteria:
          type: array
          items:
            type: string
          readOnly: true
        target_scope:
          type: array
          items:
            type: string
          readOnly: true
          description: Repo-relative path globs (Section 12.3).
        test_command:
          type: string
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
          description: |-
            Canonical G-01 state (ADR-010); draft on create (T1).

            * `draft` - draft
            * `pending` - pending
            * `in_progress` - in_progress
            * `to_be_audited` - to_be_audited
            * `in_human_review` - in_human_review
            * `completed` - completed
        version:
          type: integer
          readOnly: true
          description: 'FR-TSK-06: incremented on every change; PATCH echoes it.'
        worker_agent_id:
          type: string
          readOnly: true
          nullable: true
          description: Lease holder (WP-1.6).
        worker_session_id:
          type: string
          readOnly: true
          nullable: true
          description: Bridge session (G-18).
        claimed_role:
          type: string
          readOnly: true
          nullable: true
          description: coder | auditor | null.
        lease_acquired_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        lease_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_checkpoint_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        failure_retry_count:
          type: integer
          readOnly: true
        audit_retry_count:
          type: integer
          readOnly: true
          description: 'WP-3.3 / Section 8.2 T12: audit leases released by expiry
            (kept separate from failure_retry_count — Section 8.3 invariant 1).'
        attempt_number:
          type: integer
          readOnly: true
        audit_required:
          type: boolean
          readOnly: true
          description: Copied from the project policy at creation (Section 7.2).
        review_reason:
          type: string
          readOnly: true
          nullable: true
          description: Section 8.4 enum | null.
        latest_feedback:
          type: string
          readOnly: true
        merge_status:
          type: string
          readOnly: true
          description: none | pending | merging | merged | conflict | failed.
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Soft-archive marker; archived tasks stay readable (7.3).
        created_by:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        depends_on:
          type: array
          items:
            type: string
          description: 'Section 7.1 N:N relation (FR-TSK-07): the task ids this task
            waits on, ordered by id. Server-managed — written through the `depends_on`
            field of POST/PATCH (replace-the-set), read here.'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
          description: 'FR-ATT-03 attachment descriptors — one per live attachment:
            `id`, `filename`, `size`, `token_count`, `short_description` (the MT-1.11-04
            field set, one shape with the listing endpoints). Descriptors only — attachment
            content and derived text are never embedded; they are fetched on demand
            from GET /attachments/{id}/content (FR-ATT-03''s lazy model, FR-ATT-04).
            `token_count` and `short_description` are null before `ready` and after
            OCR-only degradation. Newest first. Every response that returns a task
            object carries them (MT-1.14-01''s recorded reading).'
      required:
      - acceptance_criteria
      - archived_at
      - attachments
      - attempt_number
      - audit_required
      - audit_retry_count
      - claimed_role
      - created_at
      - created_by
      - depends_on
      - description
      - failure_retry_count
      - id
      - last_checkpoint_at
      - latest_feedback
      - lease_acquired_at
      - lease_expires_at
      - merge_status
      - priority
      - project_id
      - review_reason
      - state
      - target_scope
      - test_command
      - title
      - updated_at
      - version
      - worker_agent_id
      - worker_session_id
    TaskCreate:
      type: object
      description: POST /projects/{pid}/tasks body — the FR-TSK-02 create inputs only.
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
          description: Markdown (FR-TSK-02); editable afterwards via PATCH.
        acceptance_criteria:
          type: array
          items:
            type: string
          description: Acceptance-criteria strings (Section 7.2).
        target_scope:
          type: array
          items:
            type: string
          description: Repo-relative globs, validated on creation (Section 12.3).
        test_command:
          type: string
          default: ''
          maxLength: 500
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: medium
          description: |-
            FR-TSK-05; default medium (documented default — not a plan fact).

            * `urgent` - urgent
            * `high` - high
            * `medium` - medium
            * `low` - low
        depends_on:
          type: array
          items:
            type: string
          description: Task ids this task waits on (Section 7.1 relation; FR-TSK-07).
            Same-project ids only; existence, self and cycles validated — a refusal
            rolls the whole create back (VALIDATION_ERROR).
      required:
      - title
    TaskListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    TokenListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TokenSummary'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    TokenSummary:
      type: object
      description: List item metadata — deliberately without ``hash`` (FR-SEC-04).
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/KindE0dEnum'
        project_id:
          type: string
          nullable: true
        scopes: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
      required:
      - expires_at
      - id
      - kind
      - last_used_at
      - project_id
      - revoked_at
      - scopes
    TransportEnum:
      enum:
      - stdio
      - http
      type: string
      description: |-
        * `stdio` - stdio
        * `http` - http
    UserSummary:
      type: object
      description: The owner identity as returned by login.
      properties:
        id:
          type: integer
        username:
          type: string
      required:
      - id
      - username
    VerdictEnum:
      enum:
      - pass
      - flag_risk
      - fail
      type: string
      description: |-
        * `pass` - pass
        * `flag_risk` - flag_risk
        * `fail` - fail
    VerdictTaskState:
      type: object
      description: The post-transition task identity the verdict response carries.
      properties:
        id:
          type: string
        state:
          type: string
          description: Canonical state after the dispatch — in_human_review (T14,
            the fail-closed escalate) or to_be_audited with merge_status pending (T13,
            engine-approved; Section 8.2).
        version:
          type: integer
          description: Optimistic-lock version after the row (7.2).
        review_reason:
          type: string
          nullable: true
          description: Section 8.4 member T14 set; null on the T13 approve branch.
        merge_status:
          type: string
          description: none | pending | merging | merged | conflict | failed (7.2)
            — pending marks T13's merge-pending sub-status.
      required:
      - id
      - merge_status
      - review_reason
      - state
      - version
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Project-scoped agent token (or owner session token in the Section
        15.4 token-auth transport) issued by POST /api/v1/tokens/agent or /auth/login.
        The server stores only its SHA-256 hash; the plaintext is shown exactly once.
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Owner session cookie issued by POST /api/v1/auth/login (HTTP-only;
        mutations also require the X-CSRFToken header duplicated from the csrftoken
        cookie).
