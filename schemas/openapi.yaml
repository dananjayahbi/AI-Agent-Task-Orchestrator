          - medium
          - low
          type: string
          minLength: 1
        description: |-
          FR-TSK-05 priority filter (single value).

          * `urgent` - urgent
          * `high` - high
          * `medium` - medium
          * `low` - low
      - in: query
        name: state
        schema:
          type: array
          items:
            enum:
            - draft
            - pending
            - in_progress
            - to_be_audited
            - in_human_review
            - completed
            type: string
            description: |-
              * `draft` - draft
              * `pending` - pending
              * `in_progress` - in_progress
              * `to_be_audited` - to_be_audited
              * `in_human_review` - in_human_review
              * `completed` - completed
