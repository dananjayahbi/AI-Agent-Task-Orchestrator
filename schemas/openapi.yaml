          description: Escalating framework-specific migration paths; Section 12.3
            rules apply (MT-3.1-03).
        sensitive_config_globs:
          type: array
          items:
            type: string
          description: Escalating env/key/security-rule paths; Section 12.3 rules
            apply (MT-3.1-03).
