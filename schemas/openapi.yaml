      type: string
      description: |-
        * `vision` - vision
        * `text_only` - text_only
        * `unknown` - unknown
    Checkpoint:
      type: object
      description: One stored checkpoint — the Section 7.2 field list, as returned.
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated row identity (7.2).
        task_id:
          type: string
          description: The addressed task (Section 7.2).
        attempt_number:
          type: integer
          description: The coder claim attempt at write time (copied, never joined
