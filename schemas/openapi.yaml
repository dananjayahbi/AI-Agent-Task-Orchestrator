      type: object
      description: The five Section 9.2 fields, in wire order, as they sit under ``error``.
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: {}
