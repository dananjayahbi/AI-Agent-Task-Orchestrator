          description: 'Fallback test-command hint (Section 10.3 example: "see task").'
        worktree_mode:
          type: boolean
          description: 'Per-task worktree advice (Section 10.3 example: false; ADR-013).'
    AgentSession:
      type: object
      description: The Section 7.2 Agent Session row as it goes over the wire.
