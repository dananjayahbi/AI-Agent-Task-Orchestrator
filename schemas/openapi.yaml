      - project_id
    AgentTokenIssueResponse:
      type: object
      description: 'POST /tokens/agent 201 body: plaintext exactly once + row metadata.'
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/KindE0dEnum'
        project_id:
          type: string
          nullable: true
        scopes: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        token:
          type: string
          description: The plaintext bearer token — returned exactly once, now. The
            server stores only its SHA-256 hash and cannot show it again (Section
            7.2); lost tokens must be revoked and reissued.
      required:
      - expires_at
      - id
      - kind
      - project_id
      - scopes
      - token
    Attachment:
      type: object
      description: |-
        One attachment descriptor — FR-ATT-03's field shape, locked here.

        One documented addition by WP-1.12 (MT-1.12-07, FR-ATT-07
        "visible"): ``failure_reason`` carries the human-readable permanent-
        failure reason when ``processing_status`` is ``failed``, null
        otherwise — schema follow-up flagged for the OpenAPI owner.
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated row identity (Section 7.2).
        task_id:
          type: string
          description: The owning task (Section 7.2).
        filename:
          type: string
          description: Client filename, path components stripped.
        mime_type:
          type: string
          description: The sniffed content type (Section 9.5 — never the declared
            one).
        size:
          type: integer
          description: Stored size in bytes (Section 7.2 ``size_bytes``).
        is_image:
          type: boolean
          description: Whether the sniffed type is an image — drives the pipeline
            split (9.5).
        processing_status:
          type: string
          description: 'FR-ATT-07 enum: uploaded | processing | ready | failed.'
        failure_reason:
          type: string
          nullable: true
          description: Human-readable reason when processing_status is failed (FR-ATT-07
            visible; Section 9.5 stage 5; null otherwise).
        token_count:
          type: integer
          nullable: true
          description: FR-ATT-03 token count — null until the WP-1.12 pipeline computes
            it.
        short_description:
          type: string
          nullable: true
          description: FR-ATT-03 short description — null until the WP-1.12 pipeline
            produces it.
        created_at:
          type: string
          format: date-time
          description: Server upload time (P7).
      required:
      - created_at
      - failure_reason
      - filename
      - id
      - is_image
      - mime_type
      - processing_status
      - short_description
      - size
      - task_id
      - token_count
    AttachmentContent:
      type: object
      description: The content endpoint's 200 body (Section 9.5 retrieval behavior).
      properties:
        attachment_id:
          type: string
          format: uuid
          description: The addressed attachment (Section 7.2).
        format:
          type: string
          description: The resolved concrete format — `auto` never reaches the wire.
        content:
          type: string
          nullable: true
          description: The delivered text (markdown page or OCR transcript), prefixed
            with the untrusted-content banner (P10; Section 9.5). Null for image_base64.
        description:
          type: string
          nullable: true
          description: 'text_ocr only: the layout description, banner-prefixed (P10);
            empty after OCR-only degradation (MT-1.13-05); null for other formats.'
        image_base64:
          type: string
          nullable: true
          description: 'image_base64 only: the normalized image (Section 9.5 stage
            2).'
        media_type:
          type: string
          nullable: true
          description: 'image_base64 only: the normalized image''s media type (always
            image/png).'
        page_number:
          type: integer
          nullable: true
          description: 'Paginated responses only: this page''s one-based number (Section
            9.5).'
        total_pages:
          type: integer
          nullable: true
          description: 'Paginated responses only: total pages — 1 for a single-page
            document (MT-1.14-03 convention).'
        token_count:
          type: integer
          nullable: true
          description: 'Paginated responses only: this page''s token estimate (as
            stored by WP-1.12) so an agent can budget context (9.5).'
      required:
      - attachment_id
      - content
      - description
      - format
      - image_base64
      - media_type
      - page_number
      - token_count
      - total_pages
    AttachmentDelete:
      type: object
      description: MT-1.11-05's DELETE response — the soft-deleted record's marker.
      properties:
        id:
          type: string
          format: uuid
          description: The deleted attachment's identity.
        task_id:
          type: string
          description: The owning task.
        deleted_at:
          type: string
          format: date-time
          description: 'Server time of the soft delete (MT-1.11-05): the retention
            job (Section 9.9) owns the hard removal (Section 16.3).'
      required:
      - deleted_at
      - id
      - task_id
    AttachmentListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    AuditDecision:
      type: object
      description: The seam's decision the 201 body reports (Section 9.4).
      properties:
        approve:
          type: boolean
          description: True only when the installed Policy Engine approved (T13);
            the fail-closed default always returns false (invariant 8.3.4).
        reason:
          type: string
          nullable: true
          description: Section 8.4 escalation reason, or null on approval.
      required:
      - approve
      - reason
    AuditReport:
      type: object
      description: One stored report — the Section 7.2 field list, as returned.
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated row identity (Section 7.2).
        task_id:
          type: string
          description: The audited task (Section 7.2).
        resolution_id:
          type: string
          format: uuid
          description: The audited submission (Section 7.2 — one report per verdict,
            accumulating across T12 audit retries).
        auditor_session_id:
          type: string
          description: Bridge session that audited (Section 7.2; G-18 — always the
            auditor lease owner at submit time).
        evidence:
          description: Section 7.2 evidence JSON — the Section 10.5 structure as supplied
            (commands with exit codes, lint_clean, stats…).
        confidence:
          type: integer
          description: Section 7.2 confidence (1-5; DB-constrained).
        auditor_notes:
          type: string
        proposed_verdict:
          allOf:
          - $ref: '#/components/schemas/ProposedVerdictEnum'
          description: |-
            Section 10.5 enum the auditor proposed; the engine decides.

            * `pass` - pass
            * `flag_risk` - flag_risk
            * `fail` - fail
        policy_decision:
          nullable: true
          description: |-
            Section 9.4 engine output (approve | escalate) — null until the Policy Engine writes it (MT-3.4-06), never faked here.

            * `approve` - approve
            * `escalate` - escalate
          allOf:
          - $ref: '#/components/schemas/PolicyDecisionEnum'
        policy_rule_results:
          nullable: true
          description: Section 7.2/9.4 per-rule pass/fail — null until the engine
            persists it (MT-3.4-06), never faked here.
        created_at:
          type: string
          format: date-time
          description: Server clock at insertion (P7).
      required:
      - auditor_notes
      - auditor_session_id
      - confidence
      - created_at
      - evidence
      - id
      - policy_decision
      - policy_rule_results
      - proposed_verdict
      - resolution_id
      - task_id
    AuditReportListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditReport'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    AuditVerdictRequest:
      type: object
      description: '``POST /tasks/{id}/audit-verdict`` input (Section 10.5 contract).'
      properties:
        session_id:
          type: string
          description: Lease-holding auditor session id (G-18) — the fencing pair's
            identity half; becomes auditor_session_id (Section 7.2).
          maxLength: 255
        lease_generation:
          type: integer
          minimum: 0
          description: Fencing generation from the claim response (Section 8.6; ADR-012
            — the pair every agent mutation carries); a stale value answers LEASE_EXPIRED.
        task_id:
          type: string
          description: The addressed task id — must equal the path id (Section 10.5
            requires task_id in the payload; the path decides, the body echoes).
        verdict:
          allOf:
          - $ref: '#/components/schemas/VerdictEnum'
          description: |-
            Section 10.5 enum: pass | flag_risk | fail — the proposal only; the Policy Engine decides the outcome (invariant 8.3.4).

            * `pass` - pass
            * `flag_risk` - flag_risk
            * `fail` - fail
        confidence:
          type: integer
          maximum: 5
          minimum: 1
          description: Section 10.5 / 7.2 confidence (1-5) — the input rule R7 reads.
        notes:
          type: string
          default: ''
          description: Auditor notes (Section 10.5 `notes` → Section 7.2 `auditor_notes`),
            shown in the review panel.
        evidence:
          description: 'Section 10.5 evidence object: required `commands` array (label/command/exit_code
            per item); `lint_clean`, durations, changed files and diff stats pass
            through as supplied (FR-AUD-02 — stored verbatim, never reshaped).'
        acceptance_criteria_results:
          type: array
          items:
            type: object
            additionalProperties: {}
          nullable: true
          description: Section 10.5 optional array of {criterion, met} — validated
            here and stored inside the report's evidence JSON (§7.2 gives it no column;
            recorded reading, MT-3.3-05).
      required:
      - confidence
      - evidence
      - lease_generation
      - session_id
      - task_id
      - verdict
    AuditVerdictResponse:
      type: object
      description: The frozen verdict response — report + outcome (Section 10.5).
      properties:
        report:
          allOf:
          - $ref: '#/components/schemas/AuditReport'
          description: The stored Section 7.2 row.
        task:
          allOf:
          - $ref: '#/components/schemas/VerdictTaskState'
          description: Post-transition task identity — the outcome the agent is told
            (decided by the seam, never by this endpoint).
        trigger:
          type: string
          description: 'Which Section 8.2 row fired: audit_verdict_escalated (T14)
            or audit_verdict_pass (T13, engine-only).'
        decision:
          allOf:
          - $ref: '#/components/schemas/AuditDecision'
          description: The Policy Engine seam's decision (approve/escalate + reason).
      required:
      - decision
      - report
      - task
      - trigger
    CapabilityEnum:
      enum:
      - vision
      - text_only
