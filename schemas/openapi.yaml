          readOnly: true
        attempt_number:
          type: integer
          readOnly: true
        audit_required:
          type: boolean
          readOnly: true
          description: Copied from the project policy at creation (Section 7.2).
        review_reason:
          type: string
          readOnly: true
          nullable: true
          description: Section 8.4 enum | null.
        latest_feedback:
          type: string
          readOnly: true
        merge_status:
          type: string
          readOnly: true
          description: none | pending | merging | merged | conflict | failed.
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Soft-archive marker; archived tasks stay readable (7.3).
        created_by:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        depends_on:
          type: array
          items:
            type: string
          description: 'Section 7.1 N:N relation (FR-TSK-07): the task ids this task
            waits on, ordered by id. Server-managed — written through the `depends_on`
            field of POST/PATCH (replace-the-set), read here.'
          readOnly: true
      required:
      - acceptance_criteria
      - archived_at
      - attempt_number
      - audit_required
      - claimed_role
      - created_at
      - created_by
      - depends_on
      - description
      - failure_retry_count
      - id
      - last_checkpoint_at
      - latest_feedback
      - lease_acquired_at
      - lease_expires_at
      - merge_status
      - priority
      - project_id
      - review_reason
      - state
      - target_scope
      - test_command
      - title
      - updated_at
      - version
      - worker_agent_id
      - worker_session_id
    TaskCreate:
      type: object
      description: POST /projects/{pid}/tasks body — the FR-TSK-02 create inputs only.
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
          description: Markdown (FR-TSK-02); editable afterwards via PATCH.
        acceptance_criteria:
          type: array
          items:
            type: string
          description: Acceptance-criteria strings (Section 7.2).
        target_scope:
          type: array
          items:
            type: string
          description: Repo-relative globs, validated on creation (Section 12.3).
        test_command:
          type: string
          default: ''
          maxLength: 500
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: medium
          description: |-
            FR-TSK-05; default medium (documented default — not a plan fact).

            * `urgent` - urgent
            * `high` - high
            * `medium` - medium
            * `low` - low
        depends_on:
          type: array
          items:
            type: string
          description: Task ids this task waits on (Section 7.1 relation; FR-TSK-07).
            Same-project ids only; existence, self and cycles validated — a refusal
            rolls the whole create back (VALIDATION_ERROR).
      required:
      - title
    TaskListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    TokenListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TokenSummary'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    TokenSummary:
      type: object
      description: List item metadata — deliberately without ``hash`` (FR-SEC-04).
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/KindE0dEnum'
        project_id:
          type: string
          nullable: true
        scopes: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
      required:
      - expires_at
      - id
      - kind
      - last_used_at
      - project_id
      - revoked_at
      - scopes
    TransportEnum:
      enum:
      - stdio
      - http
      type: string
      description: |-
        * `stdio` - stdio
        * `http` - http
    UserSummary:
      type: object
      description: The owner identity as returned by login.
      properties:
        id:
          type: integer
        username:
          type: string
      required:
      - id
      - username
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Project-scoped agent token (or owner session token in the Section
        15.4 token-auth transport) issued by POST /api/v1/tokens/agent or /auth/login.
        The server stores only its SHA-256 hash; the plaintext is shown exactly once.
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Owner session cookie issued by POST /api/v1/auth/login (HTTP-only;
        mutations also require the X-CSRFToken header duplicated from the csrftoken
        cookie).
