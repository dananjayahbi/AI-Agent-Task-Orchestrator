        plus the T4/T11 guards (project status, dependencies, `max_concurrent_tasks`
        for coders; auditor independence (`AUDITOR_SAME_AS_CODER`, G-20) and audit-lease
        availability for auditors), sets the Section 8.6 lease (policy duration, `lease_generation`
        + 1) and bumps `attempt_number` on coder claims only (FR-LEA-01/02; ADR-012
        fencing; MT-3.3-01). 200 returns task details, the lease record (role `coder`|`auditor`)
        and the Section 10.6 rules block. Errors: TASK_ALREADY_CLAIMED, TASK_NOT_FOUND,
        TASK_STATE_CONFLICT, AUDITOR_SAME_AS_CODER, DEPENDENCY_UNMET, CONCURRENCY_LIMIT_REACHED
        (409); ROLE_NOT_PERMITTED, AUTH_FORBIDDEN_PROJECT (403) — all per the documented
        mapping. `Idempotency-Key` replays a retried claim without leasing twice (NFR-12).'
      parameters:
      - in: header
        name: Idempotency-Key
