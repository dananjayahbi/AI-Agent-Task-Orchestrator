        project_id:
          type: string
          description: Target project id (PID + five digits, Section 7.3).
          pattern: ^PID[0-9]{5}$
        scopes:
          type: array
          items:
            type: string
          description: 'Agent roles this token may act as (Section 12.2 matrix roles).
            Allowed: coder, auditor, decomposer, merge_executor.'
