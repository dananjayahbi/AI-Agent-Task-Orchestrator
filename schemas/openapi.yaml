  /api/v1/tasks/{id}/claim:
    post:
      operationId: claim_task
      description: 'Atomically claim a pending task (Section 9.2 Agent-work row; caller:
        Agent coder). One transaction takes the row with `FOR UPDATE SKIP LOCKED`,
        re-validates state, project status, dependencies and `max_concurrent_tasks`
        inside the lock, sets the Section 8.6 lease and bumps `lease_generation` and
        `attempt_number` (FR-LEA-01/02; ADR-012 fencing). 200 returns task details,
        the lease record and the Section 10.6 rules block. Errors: TASK_ALREADY_CLAIMED,
        TASK_NOT_FOUND, TASK_STATE_CONFLICT, DEPENDENCY_UNMET, CONCURRENCY_LIMIT_REACHED,
        AUTH_FORBIDDEN_PROJECT — all 409/404/403 per the documented mapping. `Idempotency-Key`
        replays a retried claim without leasing twice (NFR-12).'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-derived key making retries safe (ADR-012; NFR-12). Reusing
          the key with the same request replays the original outcome instead of executing
          the claim/release again.
