      description: 'Create a task (Section 9.2 Tasks row; caller: Owner only). T1''s
        model-level step: the id is allocated server-side (`{PID}-T{index}`, Section
        7.3), `state` starts at `draft`, `version` starts at 1 (FR-TSK-06), `audit_required`
        copies the project policy, and `target_scope` globs are validated against
