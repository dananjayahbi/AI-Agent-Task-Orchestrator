      - attempt_number
      - id
      - kind
      - message
      - percent
      - session_id
      - task_id
      - timestamp
      - token_usage
    CheckpointCreate:
      type: object
      description: '``POST /tasks/{id}/checkpoints`` input (Section 10.5 tool contract).'
      properties:
        session_id:
          type: string
          description: Lease-holding session id (G-18) — the fencing pair's identity
            half.
          maxLength: 255
        lease_generation:
          type: integer
          minimum: 0
          description: Fencing generation from the claim response (Section 8.6; ADR-012);
            a stale value answers LEASE_EXPIRED.
        message:
          type: string
          default: ''
          description: The agent's progress report text (Section 10.5 tool input).
        percent:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Optional 0-100 completion hint (Section 7.2 bounds; out-of-range
            answers VALIDATION_ERROR).
        token_usage:
          description: Free JSON token accounting blob (Section 7.2) — no fixed schema
            is invented here (MT-1.8-01 risk note; an OQ would freeze one).
        kind:
          allOf:
          - $ref: '#/components/schemas/CheckpointCreateKindEnum'
          default: progress
          description: |-
            progress | liveness | system (Section 7.2); default progress — the extension-carrying kind (OQ-04 recorded reading).

            * `progress` - progress
            * `liveness` - liveness
            * `system` - system
      required:
      - lease_generation
      - session_id
    CheckpointCreateKindEnum:
      enum:
      - progress
      - liveness
      - system
      type: string
      description: |-
        * `progress` - progress
        * `liveness` - liveness
        * `system` - system
    CheckpointListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
