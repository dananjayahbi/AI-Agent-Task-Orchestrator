  /api/v1/tasks/{id}/release:
    post:
      operationId: release_task
      description: 'Voluntarily release a claimed task back to `pending` (Section
        9.2; Section 8.2 T6 — actors C, O). No `failure_retry_count` increment (FR-LEA-06);
        `attempt_number` is preserved. Agent callers must carry `session_id` and `lease_generation`
        (ADR-012): a foreign session answers LEASE_NOT_OWNED, a stale generation or
        dead lease LEASE_EXPIRED. An Owner session applies the documented override
        without the fencing pair. Optional `reason` lands on the Transition note;
        optional `version` enables the FR-TSK-06 stale-version check. 200 returns
        the updated task.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-derived key making retries safe (ADR-012; NFR-12). Reusing
          the key with the same request replays the original outcome instead of executing
          the claim/release again.
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
