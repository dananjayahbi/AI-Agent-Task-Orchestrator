        session_id:
          type: string
          description: Bridge-issued session id of the reporting agent (G-18).
        timestamp:
          type: string
          format: date-time
          description: Server clock at insertion (P7) — the feed's 'when'.
        message:
          type: string
        percent:
          type: integer
          nullable: true
          description: 0-100 hint, or null when the caller omitted it (7.2).
        token_usage:
          description: Free JSON token accounting blob (Section 7.2).
        kind:
          type: string
          description: progress | liveness | system (7.2).
