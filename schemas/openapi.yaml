components:
  schemas:
    ActiveStatusEnum:
      enum:
      - active
      - paused
      - archived
      type: string
      description: |-
        * `active` - active
        * `paused` - paused
        * `archived` - archived
    AgentHints:
      type: object
      description: Section 10.3 ``agent_hints`` — every key optional.
      properties:
        test_command_default:
          type: string
          description: 'Fallback test-command hint (Section 10.3 example: "see task").'
        worktree_mode:
          type: boolean
          description: 'Per-task worktree advice (Section 10.3 example: false; ADR-013).'
    AgentSession:
      type: object
      description: The Section 7.2 Agent Session row as it goes over the wire.
      properties:
        id:
          type: string
          readOnly: true
        project_id:
          type: string
          readOnly: true
        token_id:
          type: integer
          readOnly: true
        agent_label:
          type: string
          readOnly: true
        client_name:
          type: string
          readOnly: true
        capability:
          allOf:
          - $ref: '#/components/schemas/CapabilityEnum'
          readOnly: true
        transport:
          allOf:
          - $ref: '#/components/schemas/TransportEnum'
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - agent_label
      - capability
      - client_name
      - ended_at
      - id
      - last_seen_at
      - project_id
      - started_at
      - token_id
      - transport
    AgentSessionCreate:
      type: object
      description: '``POST /agent-sessions`` input — no project field exists here
        (ADR-004).'
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
          maxLength: 128
        agent_label:
          type: string
          default: ''
          maxLength: 255
        client_name:
          type: string
          default: ''
          maxLength: 255
        capability:
          allOf:
          - $ref: '#/components/schemas/CapabilityEnum'
          default: unknown
        transport:
          $ref: '#/components/schemas/TransportEnum'
      required:
      - id
      - transport
    AgentTokenIssueRequest:
      type: object
      description: 'POST /tokens/agent body: which project, which roles.'
      properties:
        project_id:
          type: string
          description: Target project id (PID + five digits, Section 7.3).
          pattern: ^PID[0-9]{5}$
        scopes:
          type: array
          items:
            type: string
          description: 'Agent roles this token may act as (Section 12.2 matrix roles).
            Allowed: coder, auditor, decomposer, merge_executor.'
      required:
      - project_id
    AgentTokenIssueResponse:
      type: object
      description: 'POST /tokens/agent 201 body: plaintext exactly once + row metadata.'
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/KindE0dEnum'
        project_id:
          type: string
          nullable: true
        scopes: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        token:
          type: string
          description: The plaintext bearer token — returned exactly once, now. The
            server stores only its SHA-256 hash and cannot show it again (Section
            7.2); lost tokens must be revoked and reissued.
      required:
      - expires_at
      - id
      - kind
      - project_id
      - scopes
      - token
    Attachment:
      type: object
      description: One attachment descriptor — FR-ATT-03's field shape, locked here.
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated row identity (Section 7.2).
        task_id:
          type: string
          description: The owning task (Section 7.2).
        filename:
          type: string
          description: Client filename, path components stripped.
        mime_type:
          type: string
          description: The sniffed content type (Section 9.5 — never the declared
            one).
        size:
          type: integer
          description: Stored size in bytes (Section 7.2 ``size_bytes``).
        is_image:
          type: boolean
          description: Whether the sniffed type is an image — drives the pipeline
            split (9.5).
        processing_status:
          type: string
          description: 'FR-ATT-07 enum: uploaded | processing | ready | failed.'
        token_count:
          type: integer
          nullable: true
          description: FR-ATT-03 token count — null until the WP-1.12 pipeline computes
            it.
        short_description:
          type: string
          nullable: true
          description: FR-ATT-03 short description — null until the WP-1.12 pipeline
            produces it.
        created_at:
          type: string
          format: date-time
          description: Server upload time (P7).
      required:
      - created_at
      - filename
      - id
      - is_image
      - mime_type
      - processing_status
      - short_description
      - size
      - task_id
      - token_count
    AttachmentDelete:
      type: object
      description: MT-1.11-05's DELETE response — the soft-deleted record's marker.
      properties:
        id:
          type: string
          format: uuid
          description: The deleted attachment's identity.
        task_id:
          type: string
          description: The owning task.
        deleted_at:
          type: string
          format: date-time
          description: 'Server time of the soft delete (MT-1.11-05): the retention
            job (Section 9.9) owns the hard removal (Section 16.3).'
      required:
      - deleted_at
      - id
      - task_id
    AttachmentListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    CapabilityEnum:
      enum:
      - vision
      - text_only
      - unknown
      type: string
      description: |-
        * `vision` - vision
        * `text_only` - text_only
        * `unknown` - unknown
    Checkpoint:
      type: object
      description: One stored checkpoint — the Section 7.2 field list, as returned.
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated row identity (7.2).
        task_id:
          type: string
          description: The addressed task (Section 7.2).
        attempt_number:
          type: integer
          description: The coder claim attempt at write time (copied, never joined
            — MT-1.8-01 risk note).
        session_id:
          type: string
          description: Bridge-issued session id of the reporting agent (G-18).
        timestamp:
          type: string
          format: date-time
          description: Server clock at insertion (P7) — the feed's 'when'.
        message:
          type: string
        percent:
          type: integer
          nullable: true
          description: 0-100 hint, or null when the caller omitted it (7.2).
        token_usage:
          description: Free JSON token accounting blob (Section 7.2).
        kind:
          type: string
          description: progress | liveness | system (7.2).
      required:
      - attempt_number
      - id
      - kind
      - message
      - percent
      - session_id
      - task_id
      - timestamp
      - token_usage
    CheckpointCreate:
      type: object
      description: '``POST /tasks/{id}/checkpoints`` input (Section 10.5 tool contract).'
      properties:
        session_id:
          type: string
          description: Lease-holding session id (G-18) — the fencing pair's identity
            half.
          maxLength: 255
        lease_generation:
          type: integer
          minimum: 0
          description: Fencing generation from the claim response (Section 8.6; ADR-012);
            a stale value answers LEASE_EXPIRED.
        message:
          type: string
          default: ''
          description: The agent's progress report text (Section 10.5 tool input).
        percent:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Optional 0-100 completion hint (Section 7.2 bounds; out-of-range
            answers VALIDATION_ERROR).
        token_usage:
          description: Free JSON token accounting blob (Section 7.2) — no fixed schema
            is invented here (MT-1.8-01 risk note; an OQ would freeze one).
        kind:
          allOf:
          - $ref: '#/components/schemas/CheckpointCreateKindEnum'
          default: progress
          description: |-
            progress | liveness | system (Section 7.2); default progress — the extension-carrying kind (OQ-04 recorded reading).

            * `progress` - progress
            * `liveness` - liveness
            * `system` - system
      required:
      - lease_generation
      - session_id
    CheckpointCreateKindEnum:
      enum:
      - progress
      - liveness
      - system
      type: string
      description: |-
        * `progress` - progress
        * `liveness` - liveness
        * `system` - system
    CheckpointListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Checkpoint'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    CheckpointWriteResponse:
      type: object
      description: MT-1.8-03's frozen response — Section 10.5 "Returns new expiry".
      properties:
        checkpoint:
          allOf:
          - $ref: '#/components/schemas/Checkpoint'
          description: The stored row's identity and Section 7.2 fields.
        lease_extended:
          type: boolean
          description: False for a kind that does not extend under the project's lease_extension_mode
            (OQ-04 recorded reading).
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
          description: The Section 8.6 deadline after this call — the new expiry the
            bridge turns into its next_checkpoint_due hint.
        capped:
          type: boolean
          description: True when the hard cap clamped the extension — the owner must
            submit or release (MT-1.6-03's flag, consumed here).
      required:
      - capped
      - checkpoint
      - lease_expires_at
      - lease_extended
    ClaimRequest:
      type: object
      description: '``POST /tasks/{id}/claim`` input (Section 10.5 claim_task minus
        role).'
      properties:
        session_id:
          type: string
          description: Bridge-issued session id (G-18) — the lease's identity half.
          maxLength: 255
        worker_agent_id:
          type: string
          description: Human-readable worker label (Section 7.2 worker_agent_id; self-declared
            and spoofable — a label only, G-18).
          maxLength: 255
      required:
      - session_id
      - worker_agent_id
    ClaimResponse:
      type: object
      description: 'Section 9.3 step 6: task details, lease record, rules block.'
      properties:
        task:
          $ref: '#/components/schemas/Task'
        lease:
          $ref: '#/components/schemas/LeaseRecord'
        rules_block:
          $ref: '#/components/schemas/RulesBlock'
      required:
      - lease
      - rules_block
      - task
    CodeEnum:
      enum:
      - AUTH_REQUIRED
      - AUTH_FORBIDDEN_PROJECT
      - VALIDATION_ERROR
      - TASK_NOT_FOUND
      - TASK_STATE_CONFLICT
      - TASK_ALREADY_CLAIMED
      - LEASE_EXPIRED
      - LEASE_NOT_OWNED
      - DEPENDENCY_UNMET
      - CONCURRENCY_LIMIT_REACHED
      - SCOPE_VIOLATION
      - ROLE_NOT_PERMITTED
      - AUDITOR_SAME_AS_CODER
      - ATTACHMENT_NOT_READY
      - ATTACHMENT_UNSUPPORTED_FORMAT
      - POLICY_VIOLATION
      - RATE_LIMITED
      - VERSION_CONFLICT
      - SERVER_ERROR
      type: string
      description: |-
        * `AUTH_REQUIRED` - AUTH_REQUIRED
        * `AUTH_FORBIDDEN_PROJECT` - AUTH_FORBIDDEN_PROJECT
        * `VALIDATION_ERROR` - VALIDATION_ERROR
        * `TASK_NOT_FOUND` - TASK_NOT_FOUND
        * `TASK_STATE_CONFLICT` - TASK_STATE_CONFLICT
        * `TASK_ALREADY_CLAIMED` - TASK_ALREADY_CLAIMED
        * `LEASE_EXPIRED` - LEASE_EXPIRED
        * `LEASE_NOT_OWNED` - LEASE_NOT_OWNED
        * `DEPENDENCY_UNMET` - DEPENDENCY_UNMET
        * `CONCURRENCY_LIMIT_REACHED` - CONCURRENCY_LIMIT_REACHED
        * `SCOPE_VIOLATION` - SCOPE_VIOLATION
        * `ROLE_NOT_PERMITTED` - ROLE_NOT_PERMITTED
        * `AUDITOR_SAME_AS_CODER` - AUDITOR_SAME_AS_CODER
        * `ATTACHMENT_NOT_READY` - ATTACHMENT_NOT_READY
        * `ATTACHMENT_UNSUPPORTED_FORMAT` - ATTACHMENT_UNSUPPORTED_FORMAT
        * `POLICY_VIOLATION` - POLICY_VIOLATION
        * `RATE_LIMITED` - RATE_LIMITED
        * `VERSION_CONFLICT` - VERSION_CONFLICT
        * `SERVER_ERROR` - SERVER_ERROR
    DeviceListEnvelope:
      type: object
      description: 'pagination.md envelope: exactly ``results`` + ``next_cursor``.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSummary'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null = end of list.
      required:
      - next_cursor
      - results
    DeviceRegisterRequest:
      type: object
      description: POST /devices body.
      properties:
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          description: |-
            Mobile platform: ios or android.

            * `ios` - iOS
            * `android` - Android
        push_token:
          type: string
          description: APNs/FCM registration token for push dispatch (Section 9.8).
            Sensitive at rest (Section 12.4) — stored, never returned.
        biometric_bound:
          type: boolean
          default: false
          description: Whether the client has enrolled the biometric gate for this
            device (Section 12.2; enforcement is client-side, M5).
      required:
      - platform
      - push_token
    DeviceRegisterResponse:
      type: object
      description: 'POST /devices 201 body: metadata + the token shown exactly once.'
      properties:
        id:
          type: integer
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        biometric_bound:
          type: boolean
        expires_at:
          type: string
          format: date-time
        token:
          type: string
          description: The device-bound plaintext token — returned exactly once, now;
            store it in platform secure storage. The server keeps only its SHA-256
            hash (Section 7.2) and cannot show it again.
      required:
      - biometric_bound
      - expires_at
      - id
      - platform
      - token
    DeviceSummary:
      type: object
      description: |-
        GET /devices list item — metadata only (Section 12.4; Section 7.2).

        Deliberately without ``push_token`` (sensitive at rest) and without any
        token material: the credential's expiry is shown because settings needs
        it, the hash/plaintext never leave the server.
      properties:
        id:
          type: integer
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        biometric_bound:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Last request authenticated with this device's token (Section
            7.2).
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Revocation instant; null = still active (lost-phone control).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry of the device-bound token (Section 9.10 lifetime).
      required:
      - biometric_bound
      - expires_at
      - id
      - last_seen_at
      - platform
      - revoked_at
    ErrorEnvelope:
      type: object
      description: |-
        The Section 9.2 wire envelope — five fields nested under ``error``.

        ``apps.core.errors.build_error_envelope`` emits the wrapper on the wire;
        the document must model that nesting, not a flat top-level body (the flat
        schema was a contract bug, fixed at the Wave 2 end-of-wave gate).
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelopeBody'
      required:
      - error
    ErrorEnvelopeBody:
      type: object
      description: The five Section 9.2 fields, in wire order, as they sit under ``error``.
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: {}
          nullable: true
        correlation_id:
          type: string
      required:
      - code
      - correlation_id
      - message
      - retryable
